services:

  db:
    image: postgres:18.4-alpine3.23
    restart: always
    shm_size: 128mb
    ports: 
      - "5432:5432"
    volumes:
      - leftovers-database-volume:/var/lib/postgresql/18/docker
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - leftovers-network

volumes:
  leftovers-database-volume:

networks:
  leftovers-network:
    driver: bridge
